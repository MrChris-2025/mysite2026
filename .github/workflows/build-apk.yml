name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html moviemanifest.json moviesources.js atb.png br2.html br3.html www/ 2>/dev/null || cp -r * www/ 2>/dev/null || true

      - name: Initialize Capacitor & Android Platform
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "aintThatBetter" "com.aintthatbetter.app" --web-dir www
          npx cap add android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aintThatBetter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
