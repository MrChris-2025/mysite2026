111<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe TV - Side by Side Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0a0a0c', 800: '#121216', 700: '#1a1a20', 600: '#262630' },
                        accent: { DEFAULT: '#6366f1', hover: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0c; color: #f3f4f6; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #262630; border-radius: 2px; }
        
        /* High Performance TV Panels (No blur/shadow filters to eliminate lag/dragging) */
        .glass-panel { background: #121216; border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* Fast Android TV D-Pad Focus Outline */
        .tv-focusable { transform: translateZ(0); }
        .tv-focused {
            border-color: #6366f1 !important;
            outline: 3px solid #6366f1 !important;
            outline-offset: 2px !important;
            background-color: #1a1a20 !important;
        }
        button:focus, input:focus, select:focus, a:focus {
            outline: 3px solid #6366f1 !important;
            outline-offset: 2px !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-accent selection:text-white">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 glass-panel border-b border-white/10 px-4 lg:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-6">
            <h1 onclick="switchTab('home')" id="nav-logo" tabindex="0" class="tv-focusable text-2xl font-black tracking-wider text-indigo-400 cursor-pointer">
                p<span class="text-white">Stream</span>
            </h1>
            <nav class="hidden md:flex items-center space-x-2">
                <button onclick="switchTab('home')" id="nav-home" tabindex="0" class="tv-focusable px-4 py-2 rounded-xl text-sm font-medium bg-accent text-white">Home</button>
                <button onclick="switchTab('movies')" id="nav-movies" tabindex="0" class="tv-focusable px-4 py-2 rounded-xl text-sm font-medium text-gray-400">Movies</button>
                <button onclick="switchTab('tv')" id="nav-tv" tabindex="0" class="tv-focusable px-4 py-2 rounded-xl text-sm font-medium text-gray-400">TV Shows</button>
            </nav>
        </div>

        <div class="flex items-center space-x-4">
            <input type="text" id="searchInput" placeholder="Search movies, tv..." onkeydown="handleSearch(event)" tabindex="0"
                class="tv-focusable w-40 sm:w-64 bg-dark-800 border border-white/10 rounded-xl px-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none">
            <div id="liveClock" class="hidden sm:block text-xs font-semibold text-gray-400 bg-dark-800 border border-white/5 px-3 py-2 rounded-xl">
                --/--/---- --:--
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow px-4 lg:px-8 py-6 max-w-[1600px] mx-auto w-full">
        
        <!-- HOME GALLERY VIEW -->
        <div id="view-home" class="space-y-6">
            <div id="heroBanner" class="relative rounded-2xl overflow-hidden glass-panel border border-white/10 min-h-[260px] flex items-end p-6">
                <div id="heroBg" class="absolute inset-0 bg-cover bg-center opacity-30"></div>
                <div class="relative z-20 max-w-2xl space-y-3">
                    <div id="heroBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-accent text-white uppercase">Featured</div>
                    <h2 id="heroTitle" class="text-2xl lg:text-3xl font-black text-white">Loading...</h2>
                    <p id="heroOverview" class="text-xs text-gray-300 line-clamp-2">Loading catalog...</p>
                    <div class="pt-2">
                        <button id="heroPlayBtn" tabindex="0" class="tv-focusable px-5 py-2 rounded-xl bg-accent text-white text-sm font-semibold flex items-center space-x-2">
                            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            <span>Watch Now</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between border-b border-white/10 pb-4">
                <h3 id="sectionTitle" class="text-lg font-bold text-white">Catalog Grid</h3>
                <div class="flex space-x-2 bg-dark-800 p-1 rounded-xl border border-white/5">
                    <button onclick="setFilter('all')" id="filter-all" tabindex="0" class="tv-focusable px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white">All</button>
                    <button onclick="setFilter('movie')" id="filter-movie" tabindex="0" class="tv-focusable px-3 py-1.5 rounded-lg text-xs font-medium text-gray-400">Movies</button>
                    <button onclick="setFilter('tv')" id="filter-tv" tabindex="0" class="tv-focusable px-3 py-1.5 rounded-lg text-xs font-medium text-gray-400">TV Shows</button>
                </div>
            </div>

            <!-- Small 50% Size Cards Grid -->
            <div id="mediaGrid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2.5">
                <!-- Cards injected dynamically -->
            </div>
        </div>

        <!-- SIDE-BY-SIDE LANDSCAPE PLAYER VIEW -->
        <div id="view-player" class="hidden space-y-4">
            <button onclick="closePlayer()" id="backGalleryBtn" tabindex="0" class="tv-focusable px-3 py-1.5 rounded-xl bg-dark-800 text-gray-300 text-xs font-medium inline-flex items-center space-x-2 border border-white/10">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                <span>Back to Gallery</span>
            </button>

            <!-- Landscape Side-by-Side Grid Layout -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                <!-- LEFT COLUMN: 16:9 Aspect Ratio Iframe Player (Spans 8 Cols) -->
                <div class="lg:col-span-8 space-y-4">
                    <div class="relative w-full aspect-video rounded-2xl overflow-hidden glass-panel border border-white/10 bg-black">
                        <iframe id="mediaPlayerFrame" class="w-full h-full border-0" sandbox="allow-same-origin allow-scripts allow-forms allow-pointer-lock" allowfullscreen></iframe>
                    </div>
                    <div>
                        <h2 id="playerTitle" class="text-xl font-bold text-white"></h2>
                        <p id="playerOverview" class="text-xs text-gray-400 mt-2 leading-relaxed max-h-24 overflow-y-auto"></p>
                    </div>
                </div>

                <!-- RIGHT COLUMN: Media Sources, Controls, Selectors & Summary (Spans 4 Cols) -->
                <div class="lg:col-span-4 glass-panel p-4 rounded-2xl border border-white/10 space-y-4 max-h-[85vh] overflow-y-auto">
                    <!-- Media Sources -->
                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Media Sources</h3>
                        <div id="sourceOptions" class="grid grid-cols-1 gap-2"></div>
                    </div>

                    <!-- TV Controls (Season, Episode, Next/Prev, Summary) -->
                    <div id="tvControlsSection" class="hidden space-y-4 border-t border-white/10 pt-4">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Season</label>
                                <select id="seasonSelect" onchange="onSeasonChange()" tabindex="0" class="tv-focusable w-full bg-dark-800 border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white">
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Episode</label>
                                <select id="episodeSelect" onchange="onEpisodeDropdownChange()" tabindex="0" class="tv-focusable w-full bg-dark-800 border border-white/10 rounded-xl px-2.5 py-2 text-xs text-white">
                                </select>
                            </div>
                        </div>

                        <!-- Previous / Next Episode Navigation Buttons -->
                        <div class="grid grid-cols-2 gap-2">
                            <button id="prevEpBtn" onclick="changeEpisodeOffset(-1)" tabindex="0" class="tv-focusable px-3 py-2 rounded-xl bg-dark-800 text-gray-300 text-xs font-semibold flex items-center justify-center space-x-1 border border-white/10 disabled:opacity-40">
                                <span>&larr; Previous</span>
                            </button>
                            <button id="nextEpBtn" onclick="changeEpisodeOffset(1)" tabindex="0" class="tv-focusable px-3 py-2 rounded-xl bg-dark-800 text-gray-300 text-xs font-semibold flex items-center justify-center space-x-1 border border-white/10 disabled:opacity-40">
                                <span>Next &rarr;</span>
                            </button>
                        </div>

                        <!-- Episode Summary -->
                        <div class="border-t border-white/10 pt-3">
                            <h4 id="episodeSummaryTitle" class="text-xs font-bold uppercase text-accent mb-1">Episode Summary</h4>
                            <p id="episodeSummaryText" class="text-xs text-gray-300 leading-relaxed"></p>
                        </div>
                    </div>

                    <!-- Movie Summary -->
                    <div id="movieSummarySection" class="border-t border-white/10 pt-3">
                        <h4 class="text-xs font-bold uppercase text-accent mb-1">Plot Summary</h4>
                        <p id="movieSummaryText" class="text-xs text-gray-300 leading-relaxed"></p>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="mt-auto border-t border-white/5 py-4 text-center text-xs text-gray-500">
        StreamVibe TV Aggregator &bull; Powered by TMDB API
    </footer>

    <script>
        const TMDB_KEY = '1070730380f5fee0d87cf0382670b255';
        const TMDB_BASE = 'https://api.themoviedb.org/3';
        
        let currentTab = 'home', currentFilter = 'all', mediaDataList = [], activeMedia = null;
        let currentSeasonNum = 1, currentSeasonInternalId = '', currentEpisodeInternalId = '';
        let currentEpisodesList = [], currentEpisodeIndex = 0, showSlug = '', activeSourceIndex = 0;
        let cachedFocusables = [], focusIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 10000);
            fetchMediaCatalog();
            window.addEventListener('keydown', handleRemoteNavigation);
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '');
        }

        function refreshFocusables() {
            const vHome = document.getElementById('view-home');
            const vPlayer = document.getElementById('view-player');
            const isHome = !vHome.classList.contains('hidden');
            const activeView = isHome ? vHome : vPlayer;
            cachedFocusables = Array.from(document.querySelectorAll('.tv-focusable, header input, header button, #backGalleryBtn'))
                .filter(el => activeView.contains(el) || el.closest('header'));
        }

        function handleRemoteNavigation(e) {
            if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) return;
            e.preventDefault();
            
            refreshFocusables();
            if (!cachedFocusables.length) return;

            let curr = cachedFocusables.indexOf(document.activeElement);
            if (curr === -1) curr = focusIndex;

            let next = curr;
            const cols = window.innerWidth >= 1024 ? 10 : (window.innerWidth >= 768 ? 8 : (window.innerWidth >= 640 ? 6 : 4));

            if (e.key === 'ArrowRight') next = Math.min(curr + 1, cachedFocusables.length - 1);
            else if (e.key === 'ArrowLeft') next = Math.max(curr - 1, 0);
            else if (e.key === 'ArrowDown') next = cachedFocusables[curr]?.classList.contains('media-card') ? Math.min(curr + cols, cachedFocusables.length - 1) : Math.min(curr + 1, cachedFocusables.length - 1);
            else if (e.key === 'ArrowUp') next = cachedFocusables[curr]?.classList.contains('media-card') ? Math.max(curr - cols, 0) : Math.max(curr - 1, 0);

            focusIndex = next;
            const target = cachedFocusables[focusIndex];
            if (target) {
                target.focus();
                target.scrollIntoView({ behavior: 'instant', block: 'nearest' });
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['home', 'movies', 'tv'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) btn.className = `tv-focusable px-4 py-2 rounded-xl text-sm font-medium ${t === tab ? 'bg-accent text-white' : 'text-gray-400'}`;
            });
            currentFilter = tab === 'movies' ? 'movie' : (tab === 'tv' ? 'tv' : 'all');
            fetchMediaCatalog();
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'movie', 'tv'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if(btn) btn.className = `tv-focusable px-3 py-1.5 rounded-lg text-xs font-medium ${f === filter ? 'bg-accent text-white' : 'text-gray-400'}`;
            });
            renderGrid();
        }

        async function fetchMediaCatalog(query = '') {
            try {
                let url = `${TMDB_BASE}/trending/all/day?api_key=${TMDB_KEY}`;
                if (query) url = `${TMDB_BASE}/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`;
                else if (currentFilter !== 'all') url = `${TMDB_BASE}/trending/${currentFilter}/day?api_key=${TMDB_KEY}`;

                const res = await fetch(url);
                const data = await res.json();
                mediaDataList = (data.results || []).filter(item => item.media_type === 'movie' || item.media_type === 'tv' || item.title || item.name);
                if (!query && mediaDataList.length) setupHero(mediaDataList[0]);
                renderGrid();
            } catch (err) { console.error(err); }
        }

        function setupHero(item) {
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroOverview').innerText = item.overview || '';
            if (item.backdrop_path) document.getElementById('heroBg').style.backgroundImage = `url(https://image.tmdb.org/t/p/w780${item.backdrop_path})`;
            document.getElementById('heroPlayBtn').onclick = () => openPlayer(item);
        }

        function renderGrid() {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';
            let filtered = mediaDataList;
            if (currentFilter !== 'all') {
                filtered = mediaDataList.filter(item => item.media_type === currentFilter || (currentFilter === 'movie' && item.title) || (currentFilter === 'tv' && item.name));
            }
            if (!filtered.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500">No media streams found.</div>`;
                return;
            }
            filtered.forEach(item => {
                const title = item.title || item.name;
                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w185${item.poster_path}` : 'https://via.placeholder.com/185x278';
                const card = document.createElement('div');
                card.className = 'media-card tv-focusable glass-panel rounded-lg overflow-hidden cursor-pointer flex flex-col border border-white/5';
                card.setAttribute('tabindex', '0');
                card.onclick = () => openPlayer(item);
                card.innerHTML = `
                    <div class="relative aspect-[2/3] w-full bg-dark-800">
                        <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover">
                    </div>
                    <div class="p-1.5 flex flex-col justify-between">
                        <h4 class="text-[11px] font-semibold text-white truncate">${title}</h4>
                    </div>
                `;
                grid.appendChild(card);
            });
            refreshFocusables();
        }

        function handleSearch(e) {
            if (e.key === 'Enter') fetchMediaCatalog(e.target.value.trim());
        }

        function generateSlug(t) { return (t || 'show').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, '-'); }

        async function openPlayer(item) {
            activeMedia = item;
            activeSourceIndex = 0;
            const type = item.media_type || (item.title ? 'movie' : 'tv');
            const title = item.title || item.name;

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-player').classList.remove('hidden');
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerOverview').innerText = item.overview || '';

            const tvControls = document.getElementById('tvControlsSection');
            const movieSummary = document.getElementById('movieSummarySection');
            
            if (type === 'tv') {
                tvControls.classList.remove('hidden');
                movieSummary.classList.add('hidden');
                showSlug = generateSlug(title);
                await loadTvDetails(item.id);
            } else {
                tvControls.classList.add('hidden');
                movieSummary.classList.remove('hidden');
                document.getElementById('movieSummaryText').innerText = item.overview || '';
                loadSources(type, item.id);
            }
            window.scrollTo(0,0);
            refreshFocusables();
        }

        function closePlayer() {
            document.getElementById('mediaPlayerFrame').src = '';
            document.getElementById('view-player').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            refreshFocusables();
        }

        function getSourceUrls(type, id) {
            return type === 'movie' ? {
                pstream: `https://pstream.cfd/media/tmdb-movie-${id}`,
                cinevaro: `https://cinevaro.app/media/tmdb-movie-${id}`,
                basementx: `https://basementx.lol/media/tmdb-movie-${id}`
            } : {
                pstream: `https://pstream.cfd/media/tmdb-tv-${id}-${showSlug}/${currentSeasonInternalId}/${currentEpisodeInternalId}`,
                cinevaro: `https://cinevaro.app/media/tmdb-tv-${id}-${showSlug}/${currentSeasonInternalId}/${currentEpisodeInternalId}`,
                basementx: `https://basementx.lol/media/tmdb-tv-${id}-${showSlug}/${currentSeasonInternalId}/${currentEpisodeInternalId}`
            };
        }

        function loadSources(type, id) {
            const container = document.getElementById('sourceOptions');
            container.innerHTML = '';
            const urls = getSourceUrls(type, id);
            const sources = [
                { name: 'Primary Stream (P-Stream)', url: urls.pstream },
                { name: 'CineVaro', url: urls.cinevaro },
                { name: 'BasementX', url: urls.basementx }
            ];
            document.getElementById('mediaPlayerFrame').src = sources[activeSourceIndex].url;

            sources.forEach((src, idx) => {
                const btn = document.createElement('button');
                btn.className = `tv-focusable w-full text-left px-3 py-2 rounded-xl text-xs font-medium flex items-center justify-between ${idx === activeSourceIndex ? 'bg-accent text-white' : 'bg-dark-800 text-gray-300'}`;
                btn.setAttribute('tabindex', '0');
                btn.innerHTML = `<span>${src.name}</span><span class="text-[10px]">${idx === activeSourceIndex ? 'Active' : 'Switch'}</span>`;
                btn.onclick = () => {
                    activeSourceIndex = idx;
                    document.getElementById('mediaPlayerFrame').src = src.url;
                    loadSources(type, id);
                };
                container.appendChild(btn);
            });
            refreshFocusables();
        }

        async function loadTvDetails(showId) {
            try {
                const res = await fetch(`${TMDB_BASE}/tv/${showId}?api_key=${TMDB_KEY}`);
                const data = await res.json();
                const seasonSelect = document.getElementById('seasonSelect');
                seasonSelect.innerHTML = '';
                const seasons = (data.seasons || []).filter(s => s.season_number > 0);
                seasons.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season_number;
                    opt.dataset.seasonId = s.id;
                    opt.innerText = s.name || `Season ${s.season_number}`;
                    seasonSelect.appendChild(opt);
                });
                if (seasons.length) {
                    currentSeasonInternalId = seasons[0].id;
                    currentSeasonNum = seasons[0].season_number;
                    await loadEpisodesForSeason(showId, currentSeasonNum);
                }
            } catch (e) { console.error(e); }
        }

        async function onSeasonChange() {
            const select = document.getElementById('seasonSelect');
            currentSeasonInternalId = select.options[select.selectedIndex].dataset.seasonId;
            currentSeasonNum = parseInt(select.value);
            await loadEpisodesForSeason(activeMedia.id, currentSeasonNum);
        }

        async function loadEpisodesForSeason(showId, seasonNum) {
            try {
                const res = await fetch(`${TMDB_BASE}/tv/${showId}/season/${seasonNum}?api_key=${TMDB_KEY}`);
                const data = await res.json();
                currentEpisodesList = data.episodes || [];
                const episodeSelect = document.getElementById('episodeSelect');
                episodeSelect.innerHTML = '';
                currentEpisodesList.forEach((ep, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.innerText = `E${ep.episode_number}: ${ep.name || 'Episode ' + ep.episode_number}`;
                    episodeSelect.appendChild(opt);
                });
                if (currentEpisodesList.length) selectEpisodeByIndex(0);
            } catch (e) { console.error(e); }
        }

        function onEpisodeDropdownChange() {
            selectEpisodeByIndex(parseInt(document.getElementById('episodeSelect').value, 10));
        }

        function selectEpisodeByIndex(idx) {
            if (idx < 0 || idx >= currentEpisodesList.length) return;
            currentEpisodeIndex = idx;
            const ep = currentEpisodesList[idx];
            currentEpisodeInternalId = ep.id;
            document.getElementById('episodeSelect').value = idx;
            document.getElementById('prevEpBtn').disabled = currentEpisodeIndex <= 0;
            document.getElementById('nextEpBtn').disabled = currentEpisodeIndex >= currentEpisodesList.length - 1;
            document.getElementById('episodeSummaryTitle').innerText = `S${String(currentSeasonNum).padStart(2,'0')}E${String(ep.episode_number).padStart(2,'0')} - ${ep.name || ''}`;
            document.getElementById('episodeSummaryText').innerText = ep.overview || 'No overview available.';
            if (activeMedia) loadSources(activeMedia.media_type || 'tv', activeMedia.id);
        }

        function changeEpisodeOffset(offset) {
            selectEpisodeByIndex(currentEpisodeIndex + offset);
        }
    </script>
</body>
</html>
