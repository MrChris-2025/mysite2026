<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pStream - TV & iPad Optimized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#070709', 900: '#0c0d12', 800: '#14151c', 700: '#1e202a', 600: '#2a2d3b' },
                        accent: { DEFAULT: '#5b61f4', hover: '#484ee0' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070709; color: #e5e7eb; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #070709; }
        ::-webkit-scrollbar-thumb { background: #1e202a; border-radius: 2px; }
        
        /* High-Performance Panels without expensive backdrop-blur for TV GPUs */
        .tv-card { background: #14151c; border: 1px solid rgba(255, 255, 255, 0.07); }
        
        /* D-Pad & Touch Focus Styles */
        .tv-focusable { transform: translateZ(0); transition: border-color 0.15s, background-color 0.15s; }
        .tv-focusable:focus, .tv-focusable:focus-within {
            outline: 2px solid #5b61f4 !important;
            outline-offset: 2px !important;
            border-color: #5b61f4 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-accent selection:text-white antialiased">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-dark-900 border-b border-white/10 px-4 lg:px-8 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-8">
            <h1 onclick="switchTab('home')" id="nav-logo" tabindex="0" class="tv-focusable text-2xl font-black tracking-wider text-accent cursor-pointer rounded-lg px-1">
                p<span class="text-white">Stream</span>
            </h1>
            <nav class="flex items-center space-x-2">
                <button onclick="switchTab('home')" id="nav-home" tabindex="0" class="tv-focusable px-4 py-2 rounded-xl text-xs font-semibold bg-accent text-white">Home</button>
                <button onclick="switchTab('movies')" id="nav-movies" tabindex="0" class="tv-focusable px-4 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white">Movies</button>
                <button onclick="switchTab('tv')" id="nav-tv" tabindex="0" class="tv-focusable px-4 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white">TV Shows</button>
            </nav>
        </div>

        <div class="flex items-center space-x-4">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Search movies, tv..." onkeydown="handleSearch(event)" tabindex="0"
                    class="tv-focusable w-48 sm:w-64 bg-dark-800 border border-white/10 rounded-xl px-4 py-2 text-xs text-white placeholder-gray-500 focus:outline-none">
            </div>
            <div id="liveClock" class="text-xs font-mono text-gray-400 bg-dark-800 border border-white/5 px-3 py-2 rounded-xl">
                --/--/---- --:--
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow px-4 lg:px-8 py-6 max-w-[1600px] mx-auto w-full">
        
        <!-- VIEW 1: HOME GALLERY -->
        <div id="view-home" class="space-y-6">
            <!-- Hero Banner Slider -->
            <div id="heroBanner" class="relative rounded-2xl overflow-hidden tv-card min-h-[260px] flex items-end p-6 lg:p-8">
                <div id="heroBg" class="absolute inset-0 bg-cover bg-center opacity-30"></div>
                <div class="relative z-20 max-w-2xl space-y-3">
                    <div id="heroBadge" class="inline-block px-3 py-1 rounded-full text-[10px] font-bold bg-accent text-white uppercase tracking-wider">Featured</div>
                    <h2 id="heroTitle" class="text-2xl lg:text-3xl font-black text-white">Loading...</h2>
                    <p id="heroOverview" class="text-xs text-gray-300 line-clamp-2">Loading catalog...</p>
                    <div class="pt-2">
                        <button id="heroPlayBtn" tabindex="0" class="tv-focusable px-5 py-2.5 rounded-xl bg-accent text-white text-xs font-bold flex items-center space-x-2">
                            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            <span>Watch Now</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Category Filter Bar -->
            <div class="flex items-center justify-between border-b border-white/10 pb-4">
                <h3 id="sectionTitle" class="text-base font-bold text-white">Trending Catalog</h3>
                <div class="flex space-x-2 bg-dark-800 p-1 rounded-xl border border-white/5">
                    <button onclick="setFilter('all')" id="filter-all" tabindex="0" class="tv-focusable px-3 py-1.5 rounded-lg text-xs font-semibold bg-accent text-white">All</button>
                    <button onclick="setFilter('movie')" id="filter-movie" tabindex="0" class="tv-focusable px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400">Movies</button>
                    <button onclick="setFilter('tv')" id="filter-tv" tabindex="0" class="tv-focusable px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400">TV Shows</button>
                </div>
            </div>

            <!-- Media Gallery Grid -->
            <div id="mediaGrid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-3">
                <!-- Dynamically populated cards -->
            </div>
        </div>

        <!-- VIEW 2: SIDE-BY-SIDE LANDSCAPE PLAYER (Matches Screenshot Exact Layout) -->
        <div id="view-player" class="hidden space-y-4">
            
            <!-- Back Button Bar -->
            <div>
                <button onclick="closePlayer()" id="backGalleryBtn" tabindex="0" class="tv-focusable px-3.5 py-2 rounded-xl bg-dark-800 text-gray-300 hover:text-white text-xs font-semibold inline-flex items-center space-x-2 border border-white/10">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    <span>Back to Gallery</span>
                </button>
            </div>

            <!-- Landscape Side-by-Side Grid Layout -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                
                <!-- LEFT COLUMN: 16:9 Player Viewport & Details (Spans 8 Cols) -->
                <div class="md:col-span-8 space-y-4">
                    <div class="relative w-full aspect-video rounded-2xl overflow-hidden tv-card bg-black">
                        <iframe id="mediaPlayerFrame" class="w-full h-full border-0" sandbox="allow-same-origin allow-scripts allow-forms allow-pointer-lock" allowfullscreen></iframe>
                    </div>
                    
                    <div class="space-y-1.5 pt-1">
                        <h2 id="playerTitle" class="text-xl font-bold text-white tracking-wide"></h2>
                        <p id="playerOverview" class="text-xs text-gray-400 leading-relaxed max-h-28 overflow-y-auto"></p>
                    </div>
                </div>

                <!-- RIGHT COLUMN: Media Sources, Selectors & Episode Summary (Spans 4 Cols) -->
                <div class="md:col-span-4 tv-card p-5 rounded-2xl space-y-5">
                    
                    <!-- Media Sources Section -->
                    <div>
                        <h3 class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-3">Media Sources</h3>
                        <div id="sourceOptions" class="space-y-2">
                            <!-- Dynamic sources injected here -->
                        </div>
                    </div>

                    <!-- TV Controls Section (Season, Episode, Next/Prev) -->
                    <div id="tvControlsSection" class="hidden space-y-4 border-t border-white/10 pt-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Season</label>
                                <select id="seasonSelect" onchange="onSeasonChange()" tabindex="0" class="tv-focusable w-full bg-dark-800 border border-white/10 rounded-xl px-3 py-2 text-xs font-medium text-white focus:outline-none">
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Episode</label>
                                <select id="episodeSelect" onchange="onEpisodeDropdownChange()" tabindex="0" class="tv-focusable w-full bg-dark-800 border border-white/10 rounded-xl px-3 py-2 text-xs font-medium text-white focus:outline-none">
                                </select>
                            </div>
                        </div>

                        <!-- Previous / Next Episode Navigation Buttons -->
                        <div class="grid grid-cols-2 gap-3">
                            <button id="prevEpBtn" onclick="changeEpisodeOffset(-1)" tabindex="0" class="tv-focusable px-3 py-2.5 rounded-xl bg-dark-800 text-gray-400 text-xs font-semibold flex items-center justify-center space-x-1 border border-white/10 disabled:opacity-30 disabled:pointer-events-none">
                                <span>&larr; Previous</span>
                            </button>
                            <button id="nextEpBtn" onclick="changeEpisodeOffset(1)" tabindex="0" class="tv-focusable px-3 py-2.5 rounded-xl bg-dark-800 text-gray-300 text-xs font-semibold flex items-center justify-center space-x-1 border border-white/10 disabled:opacity-30 disabled:pointer-events-none">
                                <span>Next &rarr;</span>
                            </button>
                        </div>

                        <!-- Episode Summary -->
                        <div class="border-t border-white/10 pt-4">
                            <h4 id="episodeSummaryTitle" class="text-xs font-bold uppercase text-accent mb-1.5"></h4>
                            <p id="episodeSummaryText" class="text-xs text-gray-300 leading-relaxed max-h-36 overflow-y-auto"></p>
                        </div>
                    </div>

                    <!-- Movie Summary Section -->
                    <div id="movieSummarySection" class="border-t border-white/10 pt-4">
                        <h4 class="text-xs font-bold uppercase text-accent mb-1.5">Plot Summary</h4>
                        <p id="movieSummaryText" class="text-xs text-gray-300 leading-relaxed max-h-48 overflow-y-auto"></p>
                    </div>

                </div>

            </div>
        </div>

    </main>

    <footer class="mt-auto border-t border-white/5 py-4 text-center text-[11px] text-gray-500">
        pStream TV &bull; Optimized for Android TV & iPad
    </footer>

    <script>
        const TMDB_KEY = '1070730380f5fee0d87cf0382670b255';
        const TMDB_BASE = 'https://api.themoviedb.org/3';
        
        let currentTab = 'home', currentFilter = 'all', mediaDataList = [], activeMedia = null;
        let currentSeasonNum = 1, currentSeasonInternalId = '', currentEpisodeInternalId = '';
        let currentEpisodesList = [], currentEpisodeIndex = 0, showSlug = '', activeSourceIndex = 0;
        let cachedFocusables = [], focusIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 10000);
            fetchMediaCatalog();
            window.addEventListener('keydown', handleRemoteNavigation);
        });

        function updateClock() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('liveClock').innerText = `${dateStr} ${timeStr}`;
        }

        function refreshFocusables() {
            const vHome = document.getElementById('view-home');
            const vPlayer = document.getElementById('view-player');
            const isHome = !vHome.classList.contains('hidden');
            const activeView = isHome ? vHome : vPlayer;
            cachedFocusables = Array.from(document.querySelectorAll('.tv-focusable, header input, header button, #backGalleryBtn'))
                .filter(el => activeView.contains(el) || el.closest('header'));
        }

        function handleRemoteNavigation(e) {
            if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) return;
            e.preventDefault();
            
            refreshFocusables();
            if (!cachedFocusables.length) return;

            let curr = cachedFocusables.indexOf(document.activeElement);
            if (curr === -1) curr = focusIndex;

            let next = curr;
            const cols = window.innerWidth >= 1024 ? 10 : (window.innerWidth >= 768 ? 8 : (window.innerWidth >= 640 ? 6 : 4));

            if (e.key === 'ArrowRight') next = Math.min(curr + 1, cachedFocusables.length - 1);
            else if (e.key === 'ArrowLeft') next = Math.max(curr - 1, 0);
            else if (e.key === 'ArrowDown') next = cachedFocusables[curr]?.classList.contains('media-card') ? Math.min(curr + cols, cachedFocusables.length - 1) : Math.min(curr + 1, cachedFocusables.length - 1);
            else if (e.key === 'ArrowUp') next = cachedFocusables[curr]?.classList.contains('media-card') ? Math.max(curr - cols, 0) : Math.max(curr - 1, 0);

            focusIndex = next;
            const target = cachedFocusables[focusIndex];
            if (target) {
                target.focus();
                target.scrollIntoView({ behavior: 'instant', block: 'nearest' });
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['home', 'movies', 'tv'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) btn.className = `tv-focusable px-4 py-2 rounded-xl text-xs font-semibold ${t === tab ? 'bg-accent text-white' : 'text-gray-400 hover:text-white'}`;
            });
            currentFilter = tab === 'movies' ? 'movie' : (tab === 'tv' ? 'tv' : 'all');
            fetchMediaCatalog();
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'movie', 'tv'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if(btn) btn.className = `tv-focusable px-3 py-1.5 rounded-lg text-xs font-semibold ${f === filter ? 'bg-accent text-white' : 'text-gray-400'}`;
            });
            renderGrid();
        }

        async function fetchMediaCatalog(query = '') {
            try {
                let url = `${TMDB_BASE}/trending/all/day?api_key=${TMDB_KEY}`;
                if (query) url = `${TMDB_BASE}/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`;
                else if (currentFilter !== 'all') url = `${TMDB_BASE}/trending/${currentFilter}/day?api_key=${TMDB_KEY}`;

                const res = await fetch(url);
                const data = await res.json();
                mediaDataList = (data.results || []).filter(item => item.media_type === 'movie' || item.media_type === 'tv' || item.title || item.name);
                if (!query && mediaDataList.length) setupHero(mediaDataList[0]);
                renderGrid();
            } catch (err) { console.error(err); }
        }

        function setupHero(item) {
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroOverview').innerText = item.overview || '';
            if (item.backdrop_path) document.getElementById('heroBg').style.backgroundImage = `url(https://image.tmdb.org/t/p/w780${item.backdrop_path})`;
            document.getElementById('heroPlayBtn').onclick = () => openPlayer(item);
        }

        function renderGrid() {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';
            let filtered = mediaDataList;
            if (currentFilter !== 'all') {
                filtered = mediaDataList.filter(item => item.media_type === currentFilter || (currentFilter === 'movie' && item.title) || (currentFilter === 'tv' && item.name));
            }
            if (!filtered.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500">No media streams found.</div>`;
                return;
            }
            filtered.forEach(item => {
                const title = item.title || item.name;
                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w185${item.poster_path}` : 'https://via.placeholder.com/185x278';
                const card = document.createElement('div');
                card.className = 'media-card tv-focusable tv-card rounded-lg overflow-hidden cursor-pointer flex flex-col';
                card.setAttribute('tabindex', '0');
                card.onclick = () => openPlayer(item);
                card.innerHTML = `
                    <div class="relative aspect-[2/3] w-full bg-dark-800">
                        <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover">
                    </div>
                    <div class="p-1.5 flex flex-col justify-between">
                        <h4 class="text-[11px] font-semibold text-white truncate">${title}</h4>
                    </div>
                `;
                grid.appendChild(card);
            });
            refreshFocusables();
        }

        function handleSearch(e) {
            if (e.key === 'Enter') fetchMediaCatalog(e.target.value.trim());
        }

        function generateSlug(t) { return (t || 'show').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, '-'); }

        async function openPlayer(item) {
            activeMedia = item;
            activeSourceIndex = 0;
            const type = item.media_type || (item.title ? 'movie' : 'tv');
            const title = item.title || item.name;

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-player').classList.remove('hidden');
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerOverview').innerText = item.overview || '';

            const tvControls = document.getElementById('tvControlsSection');
            const movieSummary = document.getElementById('movieSummarySection');
            
            if (type === 'tv') {
                tvControls.classList.remove('hidden');
                movieSummary.classList.add('hidden');
                showSlug = generateSlug(title);
                await loadTvDetails(item.id);
            } else {
                tvControls.classList.add('hidden');
                movieSummary.classList.remove('hidden');
                document.getElementById('movieSummaryText').innerText = item.overview || 'No overview available.';
                loadSources(type, item.id);
            }
            window.scrollTo(0,0);
            refreshFocusables();
        }

        function closePlayer() {
            document.getElementById('mediaPlayerFrame').src = '';
            document.getElementById('view-player').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            refreshFocusables();
        }

        function getSourceUrls(type, id) {
            return type === 'movie' ? {
                pstream: `https://pstream.cfd/media/tmdb-movie-${id}`,
                cinevaro: `https://cinevaro.app/media/tmdb-movie-${id}`,
                basementx: `https://basementx.lol/media/tmdb-movie-${id}`
            } : {
                pstream: `https://pstream.cfd/media/tmdb-tv-${id}-${showSlug}/${currentSeasonInternalId}/${currentEpisodeInternalId}`,
                cinevaro: `https://cinevaro.app/media/tmdb-tv-${id}-${showSlug}/${currentSeasonInternalId}/${currentEpisodeInternalId}`,
                basementx: `https://basementx.lol/media/tmdb-tv-${id}-${showSlug}/${currentSeasonInternalId}/${currentEpisodeInternalId}`
            };
        }

        function loadSources(type, id) {
            const container = document.getElementById('sourceOptions');
            container.innerHTML = '';
            const urls = getSourceUrls(type, id);
            const sources = [
                { name: 'Primary Stream (P-Stream)', url: urls.pstream },
                { name: 'CineVaro', url: urls.cinevaro },
                { name: 'BasementX', url: urls.basementx }
            ];
            document.getElementById('mediaPlayerFrame').src = sources[activeSourceIndex].url;

            sources.forEach((src, idx) => {
                const btn = document.createElement('button');
                btn.className = `tv-focusable w-full text-left px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-between border ${idx === activeSourceIndex ? 'bg-accent text-white border-accent' : 'bg-dark-800 text-gray-300 border-white/5'}`;
                btn.setAttribute('tabindex', '0');
                btn.innerHTML = `<span>${src.name}</span><span class="text-[10px] opacity-80">${idx === activeSourceIndex ? 'Active' : 'Switch'}</span>`;
                btn.onclick = () => {
                    activeSourceIndex = idx;
                    document.getElementById('mediaPlayerFrame').src = src.url;
                    loadSources(type, id);
                };
                container.appendChild(btn);
            });
            refreshFocusables();
        }

        async function loadTvDetails(showId) {
            try {
                const res = await fetch(`${TMDB_BASE}/tv/${showId}?api_key=${TMDB_KEY}`);
                const data = await res.json();
                const seasonSelect = document.getElementById('seasonSelect');
                seasonSelect.innerHTML = '';
                const seasons = (data.seasons || []).filter(s => s.season_number > 0);
                seasons.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season_number;
                    opt.dataset.seasonId = s.id;
                    opt.innerText = s.name || `Season ${s.season_number}`;
                    seasonSelect.appendChild(opt);
                });
                if (seasons.length) {
                    currentSeasonInternalId = seasons[0].id;
                    currentSeasonNum = seasons[0].season_number;
                    await loadEpisodesForSeason(showId, currentSeasonNum);
                }
            } catch (e) { console.error(e); }
        }

        async function onSeasonChange() {
            const select = document.getElementById('seasonSelect');
            currentSeasonInternalId = select.options[select.selectedIndex].dataset.seasonId;
            currentSeasonNum = parseInt(select.value);
            await loadEpisodesForSeason(activeMedia.id, currentSeasonNum);
        }

        async function loadEpisodesForSeason(showId, seasonNum) {
            try {
                const res = await fetch(`${TMDB_BASE}/tv/${showId}/season/${seasonNum}?api_key=${TMDB_KEY}`);
                const data = await res.json();
                currentEpisodesList = data.episodes || [];
                const episodeSelect = document.getElementById('episodeSelect');
                episodeSelect.innerHTML = '';
                currentEpisodesList.forEach((ep, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.innerText = `E${ep.episode_number}: ${ep.name || 'Episode ' + ep.episode_number}`;
                    episodeSelect.appendChild(opt);
                });
                if (currentEpisodesList.length) selectEpisodeByIndex(0);
            } catch (e) { console.error(e); }
        }

        function onEpisodeDropdownChange() {
            selectEpisodeByIndex(parseInt(document.getElementById('episodeSelect').value, 10));
        }

        function selectEpisodeByIndex(idx) {
            if (idx < 0 || idx >= currentEpisodesList.length) return;
            currentEpisodeIndex = idx;
            const ep = currentEpisodesList[idx];
            currentEpisodeInternalId = ep.id;
            document.getElementById('episodeSelect').value = idx;
            document.getElementById('prevEpBtn').disabled = currentEpisodeIndex <= 0;
            document.getElementById('nextEpBtn').disabled = currentEpisodeIndex >= currentEpisodesList.length - 1;
            
            document.getElementById('episodeSummaryTitle').innerText = `S${String(currentSeasonNum).padStart(2,'0')}E${String(ep.episode_number).padStart(2,'0')} - ${ep.name || ''}`;
            document.getElementById('episodeSummaryText').innerText = ep.overview || 'No overview available for this episode.';
            
            if (activeMedia) loadSources(activeMedia.media_type || 'tv', activeMedia.id);
        }

        function changeEpisodeOffset(offset) {
            selectEpisodeByIndex(currentEpisodeIndex + offset);
        }
    </script>
</body>
</html>
