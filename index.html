    <script>
        const CONFIG = {
            PARSE_APP_ID: "GUIFjcRB8wEOGXbBfBl8zu0yCRXLwcOTTT4dGcOT",
            PARSE_JS_KEY: "qqX1cAGsgv3yg2n8Gda2Le1CH7OUQDB7BvQdONRf",
            TMDB_KEY: '1070730380f5fee0d87cf0382670b255',
            SAVE_BUFFER_MS: 30000 
        };

        const allowedCountries = ['US', 'GB', 'AU', 'NZ', 'ZA', 'CA'];
        window.state = { user: null, type: 'movie', page: 1, query: '', history: {}, permanentWatched: {}, liveDetails: {}, genre: '', year: '' };
        
        let galleryData = [], saveTimeout = null, scrollInterval = null;

        const formatTimeTo12Hour = (t) => {
            if (!t) return '';
            const [h, m] = t.split(':');
            let hour = parseInt(h);
            return `${hour % 12 || 12}:${m || '00'} ${hour >= 12 ? 'PM' : 'AM'}`;
        };

        const updateClock = () => {
            const now = new Date(), h = now.getHours(), m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h % 12 || 12}:${m} ${h >= 12 ? 'PM' : 'AM'}`;
        };

        function toggleAutoscroll() {
            const btn = document.getElementById('autoscrollBtn');
            if (scrollInterval) {
                clearInterval(scrollInterval); scrollInterval = null;
                btn.classList.replace('bg-purple-600', 'bg-white/5'); btn.classList.replace('text-white', 'text-purple-400');
            } else {
                btn.classList.replace('bg-white/5', 'bg-purple-600'); btn.classList.replace('text-purple-400', 'text-white');
                scrollInterval = setInterval(() => {
                    window.scrollBy({ top: 1 });
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight) toggleAutoscroll();
                }, 30);
            }
        }

        async function fetchUpcomingDatingShows() {
            const grid = document.getElementById('calendarGrid');
            try {
                const res = await fetch('https://api.tvmaze.com/schedule/full');
                if (!res.ok) throw new Error();
                const fullSchedule = await res.json(), now = new Date(); now.setHours(0,0,0,0);
                const oneWeekLater = new Date(now.getTime() + 7 * 86400000);
                
                const filtered = fullSchedule.filter(item => {
                    if (!item._embedded?.show) return false;
                    const show = item._embedded.show;
                    const cc = show.network?.country?.code || show.webChannel?.country?.code || '';
                    if (cc && !allowedCountries.includes(cc)) return false;

                    const isReality = show.type === 'Reality';
                    const hasDating = show.genres?.some(g => g.toLowerCase().includes('romance')) || 
                                      ['dating', 'love', 'bachelor', 'dating pool', 'matchmaker'].some(k => 
                                          show.name?.toLowerCase().includes(k) || show.summary?.toLowerCase().includes(k));
                    if (!isReality || !hasDating) return false;
                    
                    const airDate = new Date(item.airstamp || `${item.airdate}T${item.airtime || '00:00'}:00`);
                    return airDate >= now && airDate <= oneWeekLater;
                }).sort((a, b) => new Date(a.airstamp) - new Date(b.airstamp));

                if (!filtered.length) { grid.innerHTML = `<div class="text-[10px] text-gray-500 col-span-full py-6 text-center">No releases listed for this week.</div>`; return; }

                grid.innerHTML = filtered.map(item => {
                    const show = item._embedded.show, airDate = new Date(item.airdate + 'T00:00:00');
                    const diffDays = Math.ceil((airDate.getTime() - now.getTime()) / 86400000);
                    const relDay = diffDays === 0 ? 'Today' : diffDays === 1 ? 'Tomorrow' : airDate.toLocaleDateString('en-US', { weekday: 'long' });
                    
                    return `
                        <div class="p-2.5 bg-white/[0.03] border border-white/5 rounded-xl flex flex-col hover:border-purple-500/40 cursor-pointer group" onclick="searchDatingShow('${show.name.replace(/'/g, "\\'")}')">
                            <div class="flex items-center justify-between gap-1 mb-1">
                                <span class="text-[8px] font-black uppercase px-1.5 py-0.5 rounded ${diffDays === 0 ? 'calendar-badge-today' : 'calendar-badge'} text-white">${relDay}</span>
                                <span class="text-[9px] font-bold text-gray-400">${formatTimeTo12Hour(item.airtime) || 'TBA'}</span>
                            </div>
                            <h4 class="text-[11px] font-extrabold text-white group-hover:text-purple-400 truncate mb-0.5">${show.name}</h4>
                            <p class="text-[9px] font-medium text-purple-400">S${item.season} • E${item.number}</p>
                        </div>`;
                }).join('');
            } catch { grid.innerHTML = `<div class="text-[10px] text-red-400 col-span-full py-6 text-center">Unable to load releases.</div>`; }
        }

        function searchDatingShow(title) {
            document.getElementById('calendarPanel').classList.add('hidden');
            document.getElementById('calendarArrow').classList.remove('rotate-180');
            state.type = 'tv';
            document.getElementById('showTvBtn').click();
            document.getElementById('searchInput').value = title;
            state.query = title; state.page = 1;
            fetchGallery(); scrollToGallery();
        }

        async function init() {
            Parse.initialize(CONFIG.PARSE_APP_ID, CONFIG.PARSE_JS_KEY);
            Parse.serverURL = "https://parseapi.back4app.com";
            state.user = Parse.User.current() || await Parse.User.logIn("vault_user", "vault_pass").catch(() => {
                const u = new Parse.User(); u.set("username", "vault_user"); u.set("password", "vault_pass"); return u.signUp();
            });
            await fetchHistory();
            populateYears();
            await fetchGenres();
            populateSourcesDropdown(); 
            fetchGallery(); 
            setupEvents();
            updateClock();
            fetchUpcomingDatingShows();
            setInterval(updateClock, 30000);
        }

        function populateYears() {
            const yearSelect = document.getElementById('yearSelect');
            for (let i = new Date().getFullYear(); i >= 1950; i--) yearSelect.add(new Option(i, i));
        }

        async function fetchGenres() {
            const res = await fetch(`https://api.themoviedb.org/3/genre/${state.type}/list?api_key=${CONFIG.TMDB_KEY}`);
            const data = await res.json();
            document.getElementById('genreSelect').innerHTML = '<option value="">All Genres</option>' + 
                data.genres.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
        }

        async function fetchHistory() {
            try {
                const query = new Parse.Query("WatchedItem");
                query.equalTo("user", state.user).descending("watchedDate");
                const results = await query.find();
                state.history = {}; state.permanentWatched = {};
                
                results.forEach(item => {
                    const tmdbId = item.get("tmdbId"), s = item.get("lastWatchedSeason"), e = item.get("lastWatchedEpisode"), isHidden = item.get("hiddenFromHistory") === true;
                    if(!state.history[tmdbId]) state.history[tmdbId] = {};
                    
                    const data = { id: item.id, obj: item, type: item.get("mediaType"), season: s, episode: e, title: item.get("title"), poster: item.get("posterPath"), watchedDate: item.get("watchedDate") || item.updatedAt, hidden: isHidden };
                    if (!isHidden) state.history[tmdbId][`${s}-${e}`] = data;
                    if (!state.permanentWatched[tmdbId] || new Date(data.watchedDate) > new Date(state.permanentWatched[tmdbId].watchedDate)) state.permanentWatched[tmdbId] = data;
                });
                renderHistory(); renderGallery();
            } catch (e) { console.error(e); }
        }

        function triggerSaveBuffer(item, s = 0, e = 0) {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => performActualSave(item, s, e), CONFIG.SAVE_BUFFER_MS);
        }

        async function performActualSave(item, s = 0, e = 0) {
            const tmdbId = item.id.toString(), key = `${s}-${e}`;
            const record = state.history[tmdbId]?.[key]?.obj || new (Parse.Object.extend("WatchedItem"))();
            
            record.set("user", state.user); record.set("tmdbId", tmdbId); record.set("mediaType", state.type); 
            record.set("lastWatchedSeason", parseInt(s)); record.set("lastWatchedEpisode", parseInt(e)); 
            record.set("title", item.title || item.name); record.set("posterPath", item.poster_path); 
            record.set("watchedDate", new Date()); record.set("hiddenFromHistory", false);

            try {
                const saved = await record.save();
                const data = { id: saved.id, obj: saved, type: state.type, season: s, episode: e, title: item.title || item.name, poster: item.poster_path, watchedDate: new Date(), hidden: false };
                if(!state.history[tmdbId]) state.history[tmdbId] = {};
                state.history[tmdbId][key] = data; state.permanentWatched[tmdbId] = data;
                renderHistory(); renderGallery(); 
            } catch (err) { console.error(err); }
        }

        async function deleteHistoryItem(tmdbId, event) {
            event.stopPropagation();
            try {
                const query = new Parse.Query("WatchedItem");
                query.equalTo("user", state.user).equalTo("tmdbId", tmdbId);
                const results = await query.find();
                results.forEach(doc => doc.set("hiddenFromHistory", true));
                await Parse.Object.saveAll(results);
                delete state.history[tmdbId];
                renderHistory(); renderGallery(); 
            } catch (err) { console.error(err); }
        }

        function renderHistory() {
            const grid = document.getElementById('historyGrid'), section = document.getElementById('historySection'), uniqueShowsLatest = [];
            for (const tmdbId in state.history) {
                const episodes = Object.values(state.history[tmdbId]).filter(x => !x.hidden);
                if (episodes.length) uniqueShowsLatest.push({ tmdbId, ...episodes.sort((a,b) => b.watchedDate - a.watchedDate)[0] });
            }
            const sortedRecent = uniqueShowsLatest.sort((a,b) => b.watchedDate - a.watchedDate).slice(0, 16);
            if (!sortedRecent.length) { section.classList.add('hidden'); return; }
            section.classList.remove('hidden');
            
            grid.innerHTML = sortedRecent.map(data => {
                const wDate = new Date(data.watchedDate), fDate = isNaN(wDate.getTime()) ? '' : `${wDate.getMonth() + 1}/${wDate.getDate()}/${wDate.getFullYear()}`;
                return `
                <div tabindex="0" class="history-card premium-card group flex items-center gap-2 p-1.5 rounded-lg cursor-pointer select-none" onclick="loadContent(${data.tmdbId}, '${data.type}', ${data.season}, ${data.episode})">
                    <div onclick="deleteHistoryItem('${data.tmdbId}', event)" class="delete-btn"><svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg></div>
                    <div class="w-7 h-10 flex-shrink-0 overflow-hidden rounded shadow-sm bg-neutral-900"><img src="https://image.tmdb.org/t/p/w200${data.poster}" class="w-full h-full object-cover"></div>
                    <div class="overflow-hidden min-w-0 flex-1 flex flex-col justify-center">
                        <h4 class="text-[10px] font-bold truncate text-white leading-tight mb-0.5">${data.title}</h4>
                        <div class="flex flex-col gap-0 leading-none">
                             <span class="text-[8px] text-purple-400 font-extrabold uppercase tracking-wide mb-0.5">${data.type === 'tv' ? `S${data.season} E${data.episode}` : 'Movie'}</span>
                             ${fDate ? `<span class="text-[7.5px] text-gray-500 font-medium">Watched: ${fDate}</span>` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function fetchGallery() {
            let url;
            const regionJoin = allowedCountries.join('|');
            if (state.query) {
                url = `https://api.themoviedb.org/3/search/${state.type}?api_key=${CONFIG.TMDB_KEY}&query=${encodeURIComponent(state.query)}&page=${state.page}`;
            } else {
                const yearParam = state.type === 'movie' ? 'primary_release_year' : 'first_air_date_year';
                url = `https://api.themoviedb.org/3/discover/${state.type}?api_key=${CONFIG.TMDB_KEY}&page=${state.page}&sort_by=popularity.desc&with_genres=${state.genre}&${yearParam}=${state.year}&with_origin_country=${regionJoin}`;
            }
            const res = await fetch(url), data = await res.json();
            let filtered = data.results || [];
            if (state.query) filtered = filtered.filter(item => !item.origin_country?.length || item.origin_country.some(c => allowedCountries.includes(c)));
            
            galleryData = filtered;
            galleryData.forEach(item => fetchLiveDetails(item.id, state.type));
            renderGallery();
            document.getElementById('pageTxt').innerText = `Page ${data.page}`;
            document.getElementById('prevBtn').disabled = data.page <= 1;
        }

        async function fetchLiveDetails(tmdbId, mediaType) {
            if (state.liveDetails[tmdbId]) return;
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${mediaType}/${tmdbId}?api_key=${CONFIG.TMDB_KEY}`);
                if (!res.ok) return;
                const details = await res.json(), today = new Date(); today.setHours(0,0,0,0);
                let nextEpDate = null, isUpcoming = false, futurePremiereString = null;

                if (mediaType === 'tv') {
                    if (details.next_episode_to_air) {
                        const airDate = new Date(details.next_episode_to_air.air_date);
                        nextEpDate = `${airDate.getMonth() + 1}/${airDate.getDate()}/${airDate.getFullYear()}`;
                        if (details.next_episode_to_air.episode_number === 1) {
                            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                            futurePremiereString = `Season ${details.next_episode_to_air.season_number} premiere: ${months[airDate.getMonth()]} ${airDate.getDate()}, ${airDate.getFullYear()}`;
                        }
                    } else if (details.status === "Returning Series" && details.seasons) {
                        const futureSeason = details.seasons.find(s => s.air_date && new Date(s.air_date) > today);
                        if (futureSeason) {
                            const airDate = new Date(futureSeason.air_date), months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                            futurePremiereString = `Season ${futureSeason.season_number} premiere: ${months[airDate.getMonth()]} ${airDate.getDate()}, ${airDate.getFullYear()}`;
                        }
                    }
                } else if (mediaType === 'movie' && details.release_date && new Date(details.release_date) > today) {
                    isUpcoming = true;
                }

                state.liveDetails[tmdbId] = { status: details.status, nextEpDate, isUpcoming, futurePremiereString, releaseDate: details.release_date || details.first_air_date || '' };
                updateCardVisuals(tmdbId);
            } catch (err) { console.error(err); }
        }

        function updateCardVisuals(tmdbId) {
            const cardWrap = document.getElementById(`card-wrap-${tmdbId}`), live = state.liveDetails[tmdbId];
            if (!cardWrap || !live) return;
            
            const dateLabel = cardWrap.querySelector('.card-release-date');
            if (dateLabel && live.releaseDate) dateLabel.innerText = live.releaseDate;

            const bannerContainer = cardWrap.querySelector('.banner-container');
            if (!bannerContainer) return;
            
            let topBannerHtml = '';
            if (live.futurePremiereString) topBannerHtml = `<div class="upcoming-banner text-[6.5px] leading-tight">${live.futurePremiereString}</div>`;
            else if (live.nextEpDate) topBannerHtml = `<div class="airdate-banner">Next: ${live.nextEpDate}</div>`;
            else if (live.isUpcoming && live.releaseDate) {
                const [y, m, d] = live.releaseDate.split('-');
                topBannerHtml = `<div class="upcoming-banner">Upcoming: ${m}/${d}/${y}</div>`;
            }
            bannerContainer.innerHTML = topBannerHtml;
        }

        const toggleSummary = (id, e) => { e.stopPropagation(); document.getElementById(`summary-${id}`).classList.toggle('active'); };

        function renderGallery() {
            document.getElementById('galleryGrid').innerHTML = galleryData.map(item => {
                const watchData = state.permanentWatched[item.id.toString()];
                return `
                <div id="card-wrap-${item.id}" tabindex="0" class="group cursor-pointer gallery-card-wrapper" onclick="loadContent(${item.id}, '${state.type}', ${watchData?.season || 1}, ${watchData?.episode || 1})">
                    <div class="premium-card gallery-poster-container rounded-xl overflow-hidden mb-2 relative">
                        <img src="https://image.tmdb.org/t/p/w400${item.poster_path}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/400x600/121212/ffffff?text=Poster+Unavailable'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div id="summary-${item.id}" class="summary-overlay" onclick="event.stopPropagation()">
                            <h5 class="text-sm font-black text-white mb-2">${item.title || item.name}</h5>
                            <p class="text-[11px] text-gray-200 leading-normal line-clamp-6">${item.overview || "No summary."}</p>
                            <button onclick="toggleSummary(${item.id}, event)" class="mt-4 text-[10px] font-black text-purple-400 uppercase tracking-widest text-left">Close</button>
                        </div>
                        <div onclick="toggleSummary(${item.id}, event)" class="info-icon-btn"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                        <div class="banner-container"></div>
                        ${watchData ? `<div class="watched-banner">${watchData.type === 'tv' ? `S${watchData.season} E${watchData.episode}` : 'Movie'}</div>` : ''}
                    </div>
                    <h4 class="text-[10px] font-bold truncate px-1 text-white group-hover:text-purple-400 transition-colors">${item.title || item.name}</h4>
                    <p class="card-release-date text-[8px] text-gray-500 font-black px-1 mt-0.5 uppercase tracking-widest">${item.release_date || item.first_air_date || 'Release: N/A'}</p>
                </div>`;
            }).join('');
            galleryData.forEach(item => updateCardVisuals(item.id));
        }

        async function loadContent(id, type, s = 1, e = 1) {
            state.type = type; 
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${CONFIG.TMDB_KEY}`);
            state.current = await res.json();
            
            document.getElementById('playerSection').classList.remove('hidden');
            document.getElementById('playerTitle').innerText = state.current.title || state.current.name;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            if (type === 'tv') {
                ['tvSelectors', 'episodeInfo', 'prevEpBtn', 'nextEpBtn'].forEach(id => document.getElementById(id).classList.remove('hidden'));
                const seasons = state.current.seasons.filter(x => x.season_number > 0);
                const sSelect = document.getElementById('seasonSelect');
                sSelect.innerHTML = seasons.map(x => `<option value="${x.season_number}">Season ${x.season_number}</option>`).join('');
                sSelect.value = s; 
                await updateEpisodes(s, e);
            } else {
                ['tvSelectors', 'episodeInfo', 'prevEpBtn', 'nextEpBtn'].forEach(id => document.getElementById(id).classList.add('hidden'));
                document.getElementById('playerSub').innerText = "Movie Stream";
                loadServerIframe("movie", id); 
                triggerSaveBuffer(state.current);
            }
        }

        async function updateEpisodes(sNum, eNum = 1) {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${state.current.id}/season/${sNum}?api_key=${CONFIG.TMDB_KEY}`);
            const data = await res.json();
            state.currentEpisodes = data.episodes;
            updateEpisodeDropdown(sNum, eNum);
            updateEpisodeDetails(eNum);
            loadServerIframe("tv", state.current.id, sNum, eNum); 
            triggerSaveBuffer(state.current, sNum, eNum);
        }

        function updateEpisodeDropdown(sNum, currentENum) {
            const eSelect = document.getElementById('episodeSelect');
            const historyForThisShow = state.history[state.current.id.toString()] || {};
            eSelect.innerHTML = state.currentEpisodes.map(ep => {
                const key = `${sNum}-${ep.episode_number}`, isWatched = !!historyForThisShow[key];
                return `<option value="${ep.episode_number}" class="${isWatched ? 'ep-watched' : ''}">${isWatched ? '✓ ' : ''}Episode ${ep.episode_number}</option>`;
            }).join('');
            if (currentENum) eSelect.value = currentENum;
        }

        function updateEpisodeDetails(eNum) {
            const episode = state.currentEpisodes.find(ep => ep.episode_number == eNum);
            if (!episode) return;
            document.getElementById('playerSub').innerText = `Season ${episode.season_number} • Episode ${eNum}`;
            document.getElementById('epTitleDisplay').innerText = episode.name;
            document.getElementById('epOverview').innerText = episode.overview || "No description available.";
            
            const sNum = document.getElementById('seasonSelect').value;
            document.getElementById('prevEpBtn').disabled = (eNum <= 1 && sNum <= 1);
            document.getElementById('nextEpBtn').disabled = (eNum >= state.currentEpisodes.length && sNum >= state.current.seasons.filter(x => x.season_number > 0).length);
        }

        async function navigateEpisode(dir) {
            let s = parseInt(document.getElementById('seasonSelect').value);
            let e = parseInt(document.getElementById('episodeSelect').value);
            if (dir === 'next') {
                if (e < state.currentEpisodes.length) e++;
                else if (s < state.current.seasons.filter(x => x.season_number > 0).length) { s++; e = 1; document.getElementById('seasonSelect').value = s; await updateEpisodes(s, e); return; }
            } else {
                if (e > 1) e--;
                else if (s > 1) {
                    s--; document.getElementById('seasonSelect').value = s;
                    const res = await fetch(`https://api.themoviedb.org/3/tv/${state.current.id}/season/${s}?api_key=${CONFIG.TMDB_KEY}`);
                    const data = await res.json(); e = data.episodes.length; await updateEpisodes(s, e); return;
                }
            }
            document.getElementById('episodeSelect').value = e;
            updateEpisodeDetails(e); updateEpisodeDropdown(s, e); 
            loadServerIframe("tv", state.current.id, s, e); 
            triggerSaveBuffer(state.current, s, e);
        }

        const scrollToGallery = () => document.getElementById('gallerySection')?.scrollIntoView({ behavior: 'smooth', block: 'start' });

        function setupEvents() {
            document.getElementById('autoscrollBtn').onclick = toggleAutoscroll;
            const calBtn = document.getElementById('calendarToggleBtn'), calPanel = document.getElementById('calendarPanel'), calArrow = document.getElementById('calendarArrow'), calScroll = document.getElementById('calendarScrollContainer');

            calBtn.onclick = (e) => { e.stopPropagation(); calPanel.classList.toggle('hidden'); calArrow.classList.toggle('rotate-180'); };
            document.getElementById('calScrollUp').onclick = (e) => { e.stopPropagation(); calScroll.scrollBy({ top: -110, behavior: 'smooth' }); };
            document.getElementById('calScrollDown').onclick = (e) => { e.stopPropagation(); calScroll.scrollBy({ top: 110, behavior: 'smooth' }); };

            const srvBtn = document.getElementById('serverSelectorBtn'), srvMenu = document.getElementById('sources-menu-options');
            srvBtn.onclick = (e) => { e.stopPropagation(); srvMenu.classList.toggle('hidden'); };

            document.addEventListener('click', (e) => {
                if (!calPanel.contains(e.target) && e.target !== calBtn) { calPanel.classList.add('hidden'); calArrow.classList.remove('rotate-180'); }
                if (!srvMenu.contains(e.target) && e.target !== srvBtn) srvMenu.classList.add('hidden');
            });

            document.getElementById('showMoviesBtn').onclick = () => { 
                state.type = 'movie'; state.page = 1; 
                document.getElementById('showMoviesBtn').className = "px-4 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-wider bg-purple-600 text-white shadow-md transition-all";
                document.getElementById('showTvBtn').className = "px-4 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-wider text-gray-400 hover:text-white transition-all";
                fetchGenres(); fetchGallery(); 
            };
            document.getElementById('showTvBtn').onclick = () => { 
                state.type = 'tv'; state.page = 1; 
                document.getElementById('showTvBtn').className = "px-4 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-wider bg-purple-600 text-white shadow-md transition-all";
                document.getElementById('showMoviesBtn').className = "px-4 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-wider text-gray-400 hover:text-white transition-all";
                fetchGenres(); fetchGallery(); 
            };

            let searchTimeout;
            document.getElementById('searchInput').oninput = (e) => { 
                clearTimeout(searchTimeout);
                state.query = e.target.value;
                searchTimeout = setTimeout(() => {
                    state.page = 1;
                    if (state.query) { document.getElementById('genreSelect').value = ""; document.getElementById('yearSelect').value = ""; state.genre = ""; state.year = ""; }
                    fetchGallery();
                }, 400);
            };

            document.getElementById('genreSelect').onchange = (e) => { state.genre = e.target.value; state.page = 1; state.query = ""; document.getElementById('searchInput').value = ""; fetchGallery(); };
            document.getElementById('yearSelect').onchange = (e) => { state.year = e.target.value; state.page = 1; state.query = ""; document.getElementById('searchInput').value = ""; fetchGallery(); };
            document.getElementById('prevBtn').onclick = () => { if (state.page > 1) { state.page--; fetchGallery(); scrollToGallery(); } };
            document.getElementById('nextBtn').onclick = () => { state.page++; fetchGallery(); scrollToGallery(); };
            document.getElementById('seasonSelect').onchange = (e) => updateEpisodes(e.target.value);
            document.getElementById('episodeSelect').onchange = (e) => {
                const s = document.getElementById('seasonSelect').value, eVal = e.target.value;
                updateEpisodeDetails(eVal); updateEpisodeDropdown(s, eVal); 
                loadServerIframe("tv", state.current.id, s, eVal); 
                triggerSaveBuffer(state.current, s, eVal);
            };
            document.getElementById('prevEpBtn').onclick = () => navigateEpisode('prev');
            document.getElementById('nextEpBtn').onclick = () => navigateEpisode('next');
            document.getElementById('fullscreenBtn').onclick = () => {
                const iframe = document.querySelector('#player-wrapper iframe');
                if (iframe?.requestFullscreen) iframe.requestFullscreen();
                else if (iframe?.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
            };

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && document.activeElement && document.activeElement !== document.body) document.activeElement.click();
            });

            window.addEventListener('message', (event) => {
                if (event.origin === 'https://streamvaultsrc.click' && event.data?.type === 'PLAYER_EVENT') {
                    if (event.data.data?.player_status === 'completed' && event.data.data?.player_info?.mediaType === 'tv') navigateEpisode('next');
                }
            });
        }
        init();
    </script>
